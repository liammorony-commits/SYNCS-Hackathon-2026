<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quadrangle Prototype</title>
    <style>
      :root{--bg:#07132a;--surface:#04121f;--accent:#38bdf8;--muted:#9ca3af}
      html,body{height:100%;margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:linear-gradient(180deg,#020617 0%,#07132a 100%);color:#e6eef8}
      .app{max-width:980px;margin:20px auto;padding:18px}
      .top-tabs{display:flex;gap:8px}
      .tab{padding:8px 12px;border-radius:8px;background:rgba(255,255,255,0.03);cursor:pointer}
      .tab.active{background:linear-gradient(90deg,#022033,#00344a);border:1px solid rgba(56,189,248,0.12)}
      .pane{margin-top:12px}
      .marker-map{height:220px;border-radius:12px;background:linear-gradient(180deg,#021428,#052233);display:flex;align-items:center;justify-content:center;color:var(--muted)}
      .holograms{margin-top:12px}
      .person-card{padding:10px;border-radius:10px;background:rgba(255,255,255,0.02);margin-top:8px}
      .scan-btn{background:linear-gradient(90deg,#06b6d4,#0ea5b7);padding:10px 18px;border-radius:999px;border:none;color:#042028;font-weight:700;cursor:pointer}
      .bottom-bar{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:12px;margin-top:18px;background:linear-gradient(180deg,#021428,#031826)}
    </style>
  </head>
  <body>
    <link rel="stylesheet" href="style.css">

    <div class="app viewport">
      <div class="location-card">
        <div class="location-icon">📍</div>
        <div>
          <h3 id="building-name">The Quadrangle</h3>
          <p id="building-meta">Built 1854 • Ceremonial Hall</p>
        </div>
      </div>

      <div class="era-switch">
        <button class="era-btn active" data-era="past">PAST</button>
        <button class="era-btn" data-era="present">PRESENT</button>
      </div>

      <div class="canvas">
        <div class="building-photo">Building photo / camera preview</div>
        <div id="memoryLayer" class="memory-layer"></div>
      </div>

      <div class="panels">
        <aside class="history-panel" id="historyPanel">
          <h4>Timeline</h4>
          <div id="timelineContainer"></div>
          <div class="about-place">
            <h5>About this place</h5>
            <p id="building-history">The Quadrangle is the ceremonial heart of campus — construction began in 1854.</p>
          </div>
        </aside>

        <main class="main-panel">
          <section class="moments-panel">
            <div class="moments-header"><h3>PRESENT MOMENTS</h3><span class="live-indicator">● live</span></div>
            <div id="momentsContainer" class="moments-container"></div>
          </section>
        </main>
      </div>

      <nav class="bottom-nav">
        <button class="nav-item">Home</button>
        <button id="scanButton" class="scan-button">SCAN</button>
        <button class="nav-item">Gallery</button>
      </nav>
    </div>

    <div id="modalRoot"></div>

    <script src="app.js"></script>
  </body>
</html>
