<svg width="520" height="680" viewBox="0 0 520 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Edmund Blacket reference portrait</title>
  <desc id="desc">Stylized portrait based on the provided historical photo reference of Edmund Blacket.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#5a5a5d"/>
      <stop offset="55%" stop-color="#3d3d40"/>
      <stop offset="100%" stop-color="#222225"/>
    </linearGradient>
    <radialGradient id="faceGrad" cx="50%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#f0f0ee"/>
      <stop offset="60%" stop-color="#d5d2cd"/>
      <stop offset="100%" stop-color="#b9b0a1"/>
    </radialGradient>
    <linearGradient id="coatGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#5e6269"/>
      <stop offset="35%" stop-color="#2a2d31"/>
      <stop offset="100%" stop-color="#171a1d"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#dfe2e8"/>
      <stop offset="100%" stop-color="#a4acb5"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
  </defs>

